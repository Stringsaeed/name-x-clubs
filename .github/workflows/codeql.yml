name: CodeQL

# Default setup rejects these uploads. Turn it off once this file is on main:
# Settings → Advanced Security → CodeQL analysis → Switch to advanced.
on:
  pull_request:
    branches:
      - main
    paths: &codeql_paths
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.mts"
      - "**/*.cts"
      - "**/package.json"
      - "**/tsconfig.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/codeql/**"
  push:
    branches:
      - main
    paths: *codeql_paths
permissions:
  contents: read
  # Cache writes need actions: write. That includes the actions: read CodeQL
  # uses to analyze workflow files.
  actions: write
  security-events: write
# A second run of this workflow for one commit replaces the first.
# Another commit is a different group, so its run keeps going.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
env:
  # Pull requests reuse the default-branch database and extract only the
  # JavaScript that changed. The bundle flag downloads that one language.
  # Pull requests also skip per-file coverage.
  CODEQL_ACTION_OVERLAY_ANALYSIS: true
  CODEQL_ACTION_OVERLAY_ANALYSIS_JAVASCRIPT: true
  CODEQL_ACTION_OVERLAY_ANALYSIS_CODE_SCANNING_JAVASCRIPT: true
  CODEQL_ACTION_PER_LANGUAGE_BUNDLES: true
  CODEQL_ACTION_SKIP_FILE_COVERAGE_ON_PRS: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Hash scanned files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.language }}" = "actions" ]; then
            content=$(git ls-files -s -- .github/workflows .github/actions)
          else
            content=$(git ls-files -s -- \
              ':(glob)**/*.ts' ':(glob)**/*.tsx' ':(glob)**/*.js' ':(glob)**/*.jsx' \
              ':(glob)**/*.mjs' ':(glob)**/*.cjs' ':(glob)**/*.mts' ':(glob)**/*.cts' \
              ':(glob)**/package.json' ':(glob)**/tsconfig.json' pnpm-workspace.yaml)
          fi
          if [ -z "$content" ]; then
            content_hash=empty
          else
            content_hash=$(printf '%s\n' "$content" | git hash-object --stdin)
          fi
          config_hash=$(git hash-object .github/workflows/codeql.yml)
          echo "key=codeql-${{ matrix.language }}-${config_hash}-${content_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore cached analysis
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/codeql-sarif
          key: ${{ steps.files.outputs.key }}

      - name: Upload cached results
        if: steps.cache.outputs.cache-hit == 'true'
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: "/language:${{ matrix.language }}"
          wait-for-processing: false

      - name: Fetch the pull request base
        if: success() && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: Initialize CodeQL
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The bundle shipped with this action. A new query pack arrives when
          # this tag changes, which also changes the cache key above.
          tools: linked

      - name: Analyze
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: github/codeql-action/analyze@v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/codeql-sarif
          upload-database: false
          wait-for-processing: false

      - name: Prepare cached results
        if: success() && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for sarif in "${RUNNER_TEMP}/codeql-sarif"/*.sarif; do
            found=1
            jq 'del(.runs[].versionControlProvenance)' "$sarif" > "$sarif.tmp"
            mv "$sarif.tmp" "$sarif"
          done
          if [ "$found" -eq 0 ]; then
            echo "CodeQL did not write a SARIF file." >&2
            exit 1
          fi

      - name: Save analysis
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/codeql-sarif
          key: ${{ steps.files.outputs.key }}
