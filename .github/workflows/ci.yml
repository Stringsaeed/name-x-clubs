name: Verify game
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: nxc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:e2e@127.0.0.1:5432/nxc_e2e
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ env.E2E_DATABASE_URL }}
      - run: psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/e2e/fixtures/leaderboard-seed.sql
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
